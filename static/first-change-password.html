<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set a new password - TrainingBench</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #F5F5F5;
            color: #1A1A1A;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
            border: 1px solid #E0E0E0;
            padding: 40px;
            width: 100%;
            max-width: 460px;
        }
        .logo { text-align: center; margin-bottom: 20px; }
        .logo h1 { color: #CC785C; font-size: 22px; margin-bottom: 10px; white-space: nowrap; }
        .intro {
            background: #FEF3EC;
            border: 1px solid #F5D7C4;
            padding: 14px 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            font-size: 13px;
            color: #5A3A2A;
            line-height: 1.5;
        }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; font-size: 14px; }
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s;
        }
        input[type="password"]:focus {
            outline: none;
            border-color: #CC785C;
            box-shadow: 0 0 0 3px rgba(204, 120, 92, 0.1);
        }
        .hint { font-size: 11px; color: #888; margin-top: 4px; }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #CC785C;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(204, 120, 92, 0.3); }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .error-message { background: #fee; color: #c33; padding: 12px 15px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; display: none; }
        .error-message.show { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo"><h1>🤖 TrainingBench</h1></div>
        <div class="intro">
            Welcome. This account was created with an auto-generated
            password. Please set a new password now before continuing.
        </div>

        <div class="error-message" id="error-message"></div>

        <form id="change-form">
            <div class="form-group">
                <label for="current">Current password</label>
                <input type="password" id="current" name="current" required autocomplete="current-password">
            </div>
            <div class="form-group">
                <label for="newpw">New password</label>
                <input type="password" id="newpw" name="newpw" required autocomplete="new-password" minlength="10">
                <div class="hint">Minimum 10 characters.</div>
            </div>
            <div class="form-group">
                <label for="confirm">Confirm new password</label>
                <input type="password" id="confirm" name="confirm" required autocomplete="new-password">
            </div>
            <button type="submit" class="submit-btn" id="submit-btn">Set new password</button>
        </form>
    </div>

    <script>
        const API_BASE = window.location.origin;
        const form = document.getElementById('change-form');
        const errorBox = document.getElementById('error-message');
        const submitBtn = document.getElementById('submit-btn');

        function showError(msg) {
            errorBox.textContent = msg;
            errorBox.classList.add('show');
        }
        function clearError() {
            errorBox.classList.remove('show');
            errorBox.textContent = '';
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            clearError();

            const token = sessionStorage.getItem('session_token');
            if (!token) {
                window.location.href = '/static/login.html';
                return;
            }

            const current = document.getElementById('current').value;
            const newpw = document.getElementById('newpw').value;
            const confirm = document.getElementById('confirm').value;

            if (newpw.length < 10) {
                showError('New password must be at least 10 characters.');
                return;
            }
            if (newpw !== confirm) {
                showError('New password and confirmation do not match.');
                return;
            }
            if (newpw === current) {
                showError('New password must differ from the current password.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Setting password...';

            try {
                const response = await fetch(`${API_BASE}/auth/change-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                    },
                    body: JSON.stringify({ current_password: current, new_password: newpw }),
                });
                const data = await response.json();
                if (!response.ok) {
                    showError(data.detail || 'Password change failed.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Set new password';
                    return;
                }
                window.location.href = '/static/index.html';
            } catch (err) {
                showError('Connection error. Please try again.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Set new password';
            }
        });

        document.getElementById('current').focus();
    </script>
</body>
</html>
